name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.41.6'
          channel: 'stable'

      - name: Install dependencies
        run: |
          for dir in . \
            packages/pos_universal_printer \
            packages/pos_universal_printer/example \
            packages/pos_universal_printer_android \
            packages/pos_universal_printer_ios \
            example; do
            (cd "$dir" && flutter pub get)
          done

      - name: Format code
        run: |
          dart format --set-exit-if-changed .

      - name: Analyze
        run: |
          flutter analyze --no-fatal-infos .

      - name: Run tests
        run: |
          cd packages/pos_universal_printer
          flutter test

      - name: Build example (APK)
        run: |
          cd example
          flutter build apk --debug
